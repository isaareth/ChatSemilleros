<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semilleros EAFIT</title>
<style>
  :root {
    --ink: #14213d;
    --ink-soft: #3a4a6b;
    --paper: #fdfaf4;
    --panel: #ffffff;
    --line: #e3ddd0;
    --accent: #c65d3b;
    --accent-soft: #f1e2da;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--paper);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    color: var(--ink);
  }
  .app {
    display: flex; flex-direction: column;
    height: 100vh; max-width: 720px; margin: 0 auto;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  header {
    padding: 22px 24px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 6px 0 0; font-size: 13.5px; color: var(--ink-soft); }
  .messages {
    flex: 1; overflow-y: auto;
    padding: 20px 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg {
    max-width: 84%;
    padding: 12px 15px;
    border-radius: 4px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user { align-self: flex-end; background: var(--ink); color: var(--paper); border-radius: 10px 10px 2px 10px; }
  .msg.bot { align-self: flex-start; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 2px 10px 10px 10px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 14px; }
  .chip {
    font-family: var(--mono); font-size: 12px; padding: 7px 12px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: var(--ink-soft); cursor: pointer;
    transition: all .15s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  form { display: flex; gap: 10px; padding: 16px 24px 22px; border-top: 1px solid var(--line); }
  input[type=text] {
    flex: 1; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 15px; font-family: inherit; background: var(--paper); color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 0 20px; border: none; border-radius: 8px; background: var(--ink); color: var(--paper); cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  .typing { align-self: flex-start; font-family: var(--mono); font-size: 13px; color: var(--ink-soft); padding: 12px 15px; }
  .dot { display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--ink-soft); margin-right:3px; animation: blink 1.2s infinite; }
  .dot:nth-child(2){ animation-delay: .2s; }
  .dot:nth-child(3){ animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="eyebrow">Semilleros de investigación · EAFIT</p>
    <h1>¿Qué semillero buscas?</h1>
    <p>Pregunta por convocatorias abiertas, requisitos, perfiles o trayectoria de los semilleros activos.</p>
  </header>
  <div class="messages" id="messages"></div>
  <div class="suggestions" id="suggestions"></div>
  <form id="chatForm">
    <input type="text" id="input" placeholder="Ej: ¿qué requisitos pide Trade Lab?" autocomplete="off" />
    <button type="submit" id="sendBtn">Enviar</button>
  </form>
</div>

<script>
const messagesEl = document.getElementById('messages');
const form = document.getElementById('chatForm');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const suggestionsEl = document.getElementById('suggestions');

// history guarda { role: 'user' | 'assistant', text: '...' }
let history = [];

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.innerHTML = 'Consultando <span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function renderSuggestions(list) {
  suggestionsEl.innerHTML = '';
  list.forEach(text => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.type = 'button';
    chip.textContent = text;
    chip.onclick = () => { input.value = text; form.requestSubmit(); };
    suggestionsEl.appendChild(chip);
  });
}

async function sendMessage(userText) {
  addMessage('user', userText);
  history.push({ role: 'user', text: userText });
  input.value = '';
  sendBtn.disabled = true;
  suggestionsEl.innerHTML = '';

  const typingEl = addTyping();

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history }),
    });
    const data = await response.json();
    typingEl.remove();

    if (response.ok && data.answer) {
      addMessage('bot', data.answer);
      history.push({ role: 'assistant', text: data.answer });
    } else {
      addMessage('bot', data.error || 'Hubo un problema consultando la información. Intenta de nuevo en un momento.');
    }
  } catch (err) {
    typingEl.remove();
    addMessage('bot', 'No se pudo conectar con el servicio. Revisa tu conexión e intenta de nuevo.');
    console.error(err);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  sendMessage(text);
});

addMessage('bot', 'Hola, soy el asistente de semilleros de investigación de EAFIT. Puedo contarte sobre perfil requerido, requisitos de postulación, objetivos y trayectoria de los semilleros activos. ¿Qué quieres saber?');
renderSuggestions([
  '¿Qué semilleros tienen requisito de promedio?',
  '¿Qué hace el semillero de Ingeniería de Software?',
  'Semilleros de la Escuela de Administración'
]);
</script>
</body>
</html>
